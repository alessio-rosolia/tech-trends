version: '3.8'

services:
  # APACHE KAFKA 
  kafka:
    image: apache/kafka:latest
    container_name: kafka-tech
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # FLUENTD 
  fluentd:
    build: ./fluentd
    container_name: fluentd-tech
    volumes:
      - ./fluentd/conf:/fluentd/etc
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    depends_on:
      - kafka

  # PYTHON INGESTION
  ingestion:
    build: ./ingestion
    container_name: python-ingestion
    depends_on:
      - fluentd

  # PYTHON STREAM PROCESSOR
  processor:
    build: ./processor
    container_name: python-processor
    extra_hosts:
      # Permette al container di collegarsi a LM Studio
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka
      - clickhouse

  # CLICKHOUSE
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123" 
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse 
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # GRAFANA
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-tech
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - clickhouse

volumes:
  clickhouse_data:
  grafana_data: